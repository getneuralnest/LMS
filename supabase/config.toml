project_id = "class-portal"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 8

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "1x0000000000000000000000000000000AA"

[auth.rate_limit]
email_sent = 2
sms_sent = 2
token_refresh = 30
sign_in_sign_ups = 10
token_verifications = 5
